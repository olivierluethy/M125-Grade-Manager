<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Grade-Manager</title>
    <script>
        /*
         * Runs before first paint so the correct theme class is already on
         * <html> when the page renders — no flash of the wrong theme.
         *
         * Dark is the default and wins on first load. prefers-color-scheme is
         * only consulted to confirm dark, never to force light: Chrome dropped
         * 'no-preference', so honouring an OS light preference here would mean
         * the app is not dark by default for most users.
         *
         * A stored choice always wins over both.
         */
        (function () {
            try {
                var stored = localStorage.getItem('gm-theme')
                var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
                if (theme === 'dark') document.documentElement.classList.add('dark')
                document.documentElement.style.colorScheme = theme
            } catch (e) {
                document.documentElement.classList.add('dark')
            }
        })()
    </script>
</head>

<body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
</body>

</html>
